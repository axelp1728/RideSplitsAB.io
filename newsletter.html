<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newsletter – RideSplits</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.7/tailwind.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
  <link rel="shortcut icon" href="./images/favicon.ico" />
</head>
<body class="bg-white text-gray-900">
  <!-- Header (same as contact) -->
  <header class="flex flex-row justify-center">
    <div class='navbar page-wide-section'>
      <a href="index.html" class="rs-logo">
        <img src="./images/android-chrome-192x192.png" class="rs-business-logo" alt="RideSplits logo">
      </a>
      <div class="searchbox">
        <svg width='16' height='16' style='fill:#27AE60' viewBox='0 0 16 16'><path d="M8 14A6 6 0 1 1 8 2a6 6 0 0 1 0 12zm0-4a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"></path></svg>
        <input type='text' placeholder='' class='nav-input-style'>
        <label class='nav-location-label'><span>Where are you going?</span></label>
        <svg width='16' height='16' fill=#27AE60 viewBox='0 0 16 16'><path d="M7.298 10.313a3.172 3.172 0 0 1-2.776-3.514 3.145 3.145 0 0 1 1.182-2.116 3.14 3.14 0 0 1 2.332-.66 3.17 3.17 0 0 1 2.777 3.515A3.15 3.15 0 0 1 9.63 9.653a3.151 3.151 0 0 1-2.332.66zM13.278 12.746l-1.733-2.192A5.122 5.122 0 0 0 12.8 7.77V7.77a5.173 5.173 0 0 0-4.53-5.733 5.111 5.111 0 0 0-3.806 1.077 5.131 5.131 0 0 0-1.929 3.452A5.174 5.174 0 0 0 7.672 12.334a5.1 5.1 0 0 0 2.287-.56l1.747 2.212 1.571-1.24z"></path></svg>
      </div>
      <ul class='navlinks-header'>
        <li><a href="index.html">HOME</a></li>
        <li><a href="about.html">ABOUT</a></li>
        <li><a href="team.html">TEAM</a></li>
        <li><a href="contact.html">CONTACT</a></li>
        <li><a href="newsletter.html" class="font-bold">NEWSLETTER</a></li>
      </ul>
    </div>
    <div style="height:40px"></div>
  </header>

  <main class="page-wide-section py-12">
    <h1 class="text-4xl md:text-5xl font-extrabold mb-2">Subscribe to the RideSplits newsletter</h1>
    <p class="text-gray-600 mb-8">Get product updates, launch cities, and promos.</p>

    <form id="newsletter-form" class="max-w-xl space-y-5">
      <div>
        <label class="block mb-2 font-semibold">Email</label>
        <input name="email" type="email" required class="w-full border rounded px-3 py-2"/>
      </div>
      <button class="get-the-app px-6 py-2 rounded" type="submit">Subscribe</button>
      <p id="newsletter-result" class="mt-3 text-sm"></p>
    </form>
  </main>

  <footer class="footer">
    <!-- reuse your existing footer -->
  </footer>

  <script>
    // POST to your Cloud Function via Hosting rewrite: /api/subscribe
    document.getElementById('newsletter-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const result = document.getElementById('newsletter-result');
      result.textContent = 'Subscribing...';
      try {
        const form = e.target;
        const payload = { email: form.email.value.trim() };
        const res = await fetch('/api/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        if (!res.ok) throw new Error(await res.text());
        result.textContent = 'Thanks! You’re on the list.';
        form.reset();
      } catch (err) {
        result.textContent = 'Sorry—something went wrong. Please try again.';
        console.error(err);
      }
    });
  </script>
</body>
</html>
