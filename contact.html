<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact – RideSplits</title>

  <link rel="preload" href="style.css" as="style" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header / Nav -->
  <header class="flex flex-row justify-center">
    <div class="navbar page-wide-section">
      <a href="index.html" class="rs-logo">
        <img src="./images/android-chrome-192x192.png" class="rs-business-logo" alt="RideSplits" />
      </a>
      <div class="searchbox">
        <svg width="16" height="16" style="fill:#27AE60" viewBox="0 0 16 16"><path d="M8 14A6 6 0 1 1 8 2a6 6 0 0 1 0 12zm0-4a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
        <input type="text" class="nav-input-style" placeholder="" />
        <label class="nav-location-label"><span>Where are you going?</span></label>
        <svg width="16" height="16" style="fill:#27AE60" viewBox="0 0 16 16"><path d="M7.298 10.313a3.172 3.172 0 0 1-2.776-3.514 3.145 3.145 0 0 1 1.182-2.116 3.14 3.14 0 0 1 2.332-.66 3.17 3.17 0 0 1 2.777 3.515A3.15 3.15 0 0 1 9.63 9.653a3.151 3.151 0 0 1-2.332.66z"/></svg>
      </div>
      <ul class="navlinks-header">
        <li><a href="index.html">HOME</a></li>
        <li><a href="about.html">ABOUT</a></li>
        <li><a href="team.html">TEAM</a></li>
        <li><a href="contact.html">CONTACT</a></li>
        <li><a href="newsletter.html">NEWSLETTER</a></li>
      </ul>
    </div>
    <div style="height:40px"></div>
  </header>

  <main class="page-wide-section" style="max-width: 720px; margin: 0 auto;">
    <h1 style="font-size:40px; font-weight:800; margin: 24px 0;">Contact RideSplits</h1>
    <p style="margin-bottom: 24px;">Questions, partnerships, or press? Drop us a line.</p>

    <form id="contactForm">
      <label for="cName">Name</label>
      <input id="cName" name="name" type="text" required class="input-style" style="width:100%; margin:8px 0 16px"/>

      <label for="cEmail">Email</label>
      <input id="cEmail" name="email" type="email" required class="input-style" style="width:100%; margin:8px 0 16px"/>

      <label for="cTopic">Topic</label>
      <select id="cTopic" name="topic" class="input-style" style="width:100%; margin:8px 0 16px">
        <option>General</option>
        <option>Partnership</option>
        <option>Press</option>
        <option>Support</option>
      </select>

      <label for="cMessage">Message</label>
      <textarea id="cMessage" name="message" required rows="6" class="input-style" style="width:100%; margin:8px 0 16px"></textarea>

      <button id="contactSubmit" type="submit" class="get-the-app">Send</button>
      <div id="contactStatus" style="margin-top:12px; min-height:24px; color:#666;"></div>
    </form>
  </main>

  <!-- Firebase (CDN) + Firestore write -->
  <script type="module">
    // Firebase SDK (your correct project)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getFirestore, addDoc, collection, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDg-HaGX3lXZWx4sleFabnUWwP9jRqB2qU",
      authDomain: "ridesplit-site.firebaseapp.com",
      projectId: "ridesplit-site",
      storageBucket: "ridesplit-site.firebasestorage.app",
      messagingSenderId: "649981553991",
      appId: "1:649981553991:web:65254943bcf66e45c53062"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    // Contact form handler
    const form   = document.getElementById("contactForm");
    const status = document.getElementById("contactStatus");
    const submit = document.getElementById("contactSubmit");

    const emailOk = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      status.textContent = "";
      submit.disabled = true; submit.textContent = "Sending…";

      const name    = document.getElementById("cName").value.trim();
      const email   = document.getElementById("cEmail").value.trim();
      const topic   = document.getElementById("cTopic").value.trim();
      const message = document.getElementById("cMessage").value.trim();

      if (!name || !emailOk(email) || !message) {
        status.textContent = "Please provide your name, a valid email, and a message.";
        status.style.color = "#b00020";
        submit.disabled = false; submit.textContent = "Send";
        return;
      }

      try {
        await addDoc(collection(db, "contacts"), {
          name, email, topic, message,
          createdAt: serverTimestamp(),
          ua: navigator.userAgent
        });
        status.textContent = "Thanks! We received your message.";
        status.style.color = "#1b5e20";
        form.reset();
      } catch (err) {
        console.error(err);
        status.textContent = "Sorry—something went wrong. Please try again.";
        status.style.color = "#b00020";
      } finally {
        submit.disabled = false; submit.textContent = "Send";
      }
    });
  </script>
</body>
</html>
